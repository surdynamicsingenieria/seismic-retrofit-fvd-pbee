name: SPEAR Jeong-Elnashai M0
on:
  push:
    branches: [spear-jeong-elnashai-m0]
    paths:
      - "models/SPEAR/jeong_elnashai/**"
      - ".github/workflows/spear-jeong-elnashai.yml"
  workflow_dispatch:
jobs:
  modal-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libblas3 liblapack3
      - run: python -m pip install openseespy
      - name: Audit source-locked mass ledger
        run: cd models/SPEAR/jeong_elnashai && python mass_gravity_audit.py
      - name: Compile-check Jeong-Elnashai modal source
        run: python -m py_compile models/SPEAR/jeong_elnashai/spear_m0_jeong_elnashai.py
      - name: Run independent Jeong-Elnashai modal baseline
        run: python models/SPEAR/jeong_elnashai/spear_m0_jeong_elnashai.py
      - name: Compile-check independent nonlinear model
        run: python -m py_compile models/SPEAR/jeong_elnashai/spear_m0_jeong_elnashai_nonlinear.py
      - name: Run +X nonlinear diagnostic
        run: python models/SPEAR/jeong_elnashai/spear_m0_jeong_elnashai_nonlinear.py
      - name: Preserve diagnostic CSV and JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jeong-elnashai-pushover-diagnostics
          path: results/SPEAR/jeong_elnashai/pushover/
          if-no-files-found: warn
