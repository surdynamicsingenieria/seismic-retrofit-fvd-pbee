name: ZEUS-NL con2 source audit

on:
  push:
    branches: [spear-jeong-elnashai-m0]
    paths:
      - '.github/workflows/zeusnl-con2-source-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Google Code archive
        run: |
          set -euo pipefail
          url="https://storage.googleapis.com/google-code-archive-source/v2/code.google.com/zeus-nl/source-archive.zip"
          curl --fail --location --retry 3 "$url" --output /tmp/zeus-nl-source.zip
          mkdir -p /tmp/zeus-nl-source
          unzip -q /tmp/zeus-nl-source.zip -d /tmp/zeus-nl-source
      - name: Extract con2 implementation evidence
        run: |
          set -euo pipefail
          out=validation/zeusnl_source_audit
          mkdir -p "$out/archive_documents"
          find /tmp/zeus-nl-source -type f | sort > "$out/file_manifest.txt"
          grep -RniaI -E 'con2|Mander|Martinez.Rueda|Martinez-Rueda|confinement' /tmp/zeus-nl-source             > "$out/con2_hits.txt" || true
          find /tmp/zeus-nl-source -type f \( -iname '*material*' -o -iname '*.wiki' -o -iname '*.html' \)             -exec cp --parents '{}' "$out/archive_documents" \;
          {
            echo "archive_file_count=$(wc -l < "$out/file_manifest.txt")"
            echo "con2_hit_count=$(wc -l < "$out/con2_hits.txt")"
            echo "non_svn_trunk_files=$(find /tmp/zeus-nl-source/zeus-nl/trunk -type f ! -path '*/.svn/*' | wc -l)"
          } | tee "$out/audit_summary.txt"
          sed -n '1,400p' "$out/con2_hits.txt"
      - name: Package source evidence
        uses: actions/upload-artifact@v4
        with:
          name: zeusnl-con2-source-audit
          path: validation/zeusnl_source_audit
          if-no-files-found: error
