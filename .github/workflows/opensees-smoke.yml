name: OpenSeesPy smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenSeesPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install openseespy

      - name: Run OpenSeesPy smoke test
        run: python ci/opensees_smoke_test.py
