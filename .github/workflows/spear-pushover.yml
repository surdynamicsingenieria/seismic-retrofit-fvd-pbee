name: SPEAR nonlinear pushover

on:
  push:
    branches: [main]
    paths:
      - "models/SPEAR/spear_m0_nonlinear_efcp.py"
      - "validation/**"
      - ".github/workflows/spear-pushover.yml"
  workflow_dispatch:

jobs:
  pushover-x:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas3 liblapack3
      - name: Install OpenSeesPy
        run: python -m pip install openseespy
      - name: Run nonlinear EFCP +X pushover
        run: |
          python validation/debug_nl_hinges.py
          python validation/diagnose_column_stiffness.py
          python validation/diagnose_beam_hinge_stiffness.py
          python validation/diagnose_beam_formulations.py
          python validation/diagnose_zeroLength_constraints.py
          python validation/diagnose_static_beam_connection.py
          python validation/diagnose_concentrated_plasticity_sweep.py
          python validation/diagnose_cp_mm_units.py
          python models/SPEAR/spear_m0_nonlinear_columns_efcp.py validation/results/pushover_x_columns_candidate.csv
          python models/SPEAR/spear_m0_nonlinear_efcp_cp.py validation/results/pushover_x_cp_candidate.csv
          python models/SPEAR/spear_m0_nonlinear_efcp.py validation/results/pushover_x_candidate.csv
      - name: Show candidate output
        if: always()
        run: |
          test -f validation/results/pushover_x_candidate.csv && tail -20 validation/results/pushover_x_candidate.csv || true
